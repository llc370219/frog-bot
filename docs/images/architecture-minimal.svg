<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"
     role="img" aria-labelledby="title desc">
  <title id="title">Onefrog 系统架构</title>
  <desc id="desc">目标架构 · 部分功能规划中。01 对话与统筹 · 02 调度与执行 · 03 安全与工具 · 远程主机（规划）。</desc>

  <defs>
    <marker id="m-char" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#262624"/>
    </marker>
    <marker id="m-terr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C16C50"/>
    </marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A857C"/>
    </marker>
    <style type="text/css"><![CDATA[
      .t-title { font: 600 32px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #262624; }
      .t-sub   { font: 400 18px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; }
      .t-lane  { font: 600 15px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; letter-spacing: 0.06em; }
      .t-h     { font: 600 22px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #262624; }
      .t-body  { font: 400 18px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #262624; }
      .t-muted { font: 400 16px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; }
      .t-small { font: 400 15px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; }
      .t-tag   { font: 500 14px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #C16C50; }
      .t-edge  { font: 400 15px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; }
      .t-foot  { font: 400 15px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #8A857C; }
      .card    { fill: #FFFFFF; stroke: #D8D4CB; stroke-width: 1.25; }
      .shell   { fill: #FFFFFF; stroke: #D8D4CB; stroke-width: 1.25; }
      .dot     { fill: #C16C50; }
    ]]></style>
  </defs>

  <rect width="1800" height="1200" fill="#FAF9F5"/>

  <!-- Header -->
  <g id="header">
    <text x="900" y="48" text-anchor="middle" class="t-title">Onefrog 系统架构</text>
    <text x="900" y="78" text-anchor="middle" class="t-sub">目标架构 · 部分功能规划中</text>
  </g>

  <!-- User + UI -->
  <g id="user-ui">
    <rect x="800" y="104" width="200" height="52" rx="10" class="card"/>
    <text x="900" y="137" text-anchor="middle" class="t-h">用户</text>

    <line x1="900" y1="156" x2="900" y2="184" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>

    <rect x="720" y="186" width="360" height="64" rx="10" class="card"/>
    <text x="900" y="214" text-anchor="middle" class="t-h">前端 UI</text>
    <text x="900" y="238" text-anchor="middle" class="t-muted">聊天 · 工作卡片 · 审批 · 密钥卡</text>
  </g>

  <line x1="900" y1="250" x2="900" y2="286" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>
  <text x="912" y="274" class="t-edge">REST</text>

  <!-- Local host shell -->
  <g id="main-host">
    <rect x="40" y="294" width="1240" height="680" rx="14" class="shell"/>
    <text x="64" y="326" class="t-lane">本机主机</text>
  </g>

  <!-- ===== 01 对话与统筹 ===== -->
  <g id="lane-01">
    <text x="64" y="362" class="t-lane">01  ·  对话与统筹</text>

    <g id="bots">
      <rect x="64" y="380" width="160" height="96" rx="10" class="card"/>
      <text x="144" y="418" text-anchor="middle" class="t-body">Bot 1</text>
      <text x="144" y="446" text-anchor="middle" class="t-muted">私有记忆</text>
      <text x="144" y="466" text-anchor="middle" class="t-tag">规划</text>

      <rect x="244" y="380" width="160" height="96" rx="10" class="card"/>
      <text x="324" y="418" text-anchor="middle" class="t-body">Bot 2</text>
      <text x="324" y="446" text-anchor="middle" class="t-muted">私有记忆</text>
      <text x="324" y="466" text-anchor="middle" class="t-tag">规划</text>

      <rect x="424" y="380" width="160" height="96" rx="10" class="card"/>
      <text x="504" y="418" text-anchor="middle" class="t-body">Bot 3</text>
      <text x="504" y="446" text-anchor="middle" class="t-muted">私有记忆</text>
      <text x="504" y="466" text-anchor="middle" class="t-tag">规划</text>

      <rect x="604" y="380" width="160" height="96" rx="10" class="card"/>
      <text x="684" y="418" text-anchor="middle" class="t-body">Bot n</text>
      <text x="684" y="446" text-anchor="middle" class="t-muted">私有记忆</text>
      <text x="684" y="466" text-anchor="middle" class="t-tag">规划</text>

      <line x1="224" y1="428" x2="244" y2="428" stroke="#D8D4CB" stroke-width="1.25"/>
      <line x1="404" y1="428" x2="424" y2="428" stroke="#D8D4CB" stroke-width="1.25"/>
      <line x1="584" y1="428" x2="604" y2="428" stroke="#D8D4CB" stroke-width="1.25"/>
    </g>

    <rect x="800" y="380" width="220" height="96" rx="10" class="card"/>
    <text x="910" y="424" text-anchor="middle" class="t-body">共享记忆</text>
    <text x="910" y="452" text-anchor="middle" class="t-muted">跨 Bot · 对等收件箱</text>

    <text x="64" y="508" class="t-muted">聊天层统筹：理解 · 拆任务 · 调度 · 汇报</text>
  </g>

  <!-- ===== 02 调度与执行 ===== -->
  <g id="lane-02">
    <text x="64" y="556" class="t-lane">02  ·  调度与执行</text>

    <rect x="64" y="576" width="170" height="88" rx="10" class="card"/>
    <text x="149" y="614" text-anchor="middle" class="t-body">定时调度器</text>
    <text x="149" y="642" text-anchor="middle" class="t-muted">到点入队</text>

    <line x1="234" y1="620" x2="274" y2="620" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>

    <rect x="274" y="576" width="170" height="88" rx="10" class="card"/>
    <text x="359" y="614" text-anchor="middle" class="t-body">任务队列</text>
    <text x="359" y="642" text-anchor="middle" class="t-muted">持久化 · 去重</text>

    <line x1="444" y1="620" x2="484" y2="620" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>

    <rect x="484" y="576" width="190" height="88" rx="10" class="card"/>
    <text x="579" y="614" text-anchor="middle" class="t-body">任务监督器</text>
    <text x="579" y="642" text-anchor="middle" class="t-muted">启停 · 卡住检测</text>

    <line x1="674" y1="620" x2="714" y2="620" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>

    <rect x="714" y="568" width="506" height="104" rx="10" class="card"/>
    <text x="967" y="608" text-anchor="middle" class="t-body">共享 Agent 池 · 任务运行环境</text>
    <text x="967" y="638" text-anchor="middle" class="t-muted">本地并行槽位 · 通用引擎 + 工具集</text>
    <text x="967" y="662" text-anchor="middle" class="t-small">步骤事件写入事件服务</text>
  </g>

  <!-- 派活: Bot3 bottom -> supervisor top (left corridor inside lane gap) -->
  <path d="M 504 476 L 504 530 L 579 530 L 579 576"
        fill="none" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>
  <text x="520" y="522" class="t-edge">派活</text>

  <!-- ① wake: supervisor left -> up gutter -> Bot1 -->
  <path d="M 484 610 L 40 610 L 40 428 L 64 428"
        fill="none" stroke="#C16C50" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-terr)"/>
  <text x="52" y="590" class="t-edge" fill="#C16C50">① 唤醒</text>

  <!-- ===== 03 安全与工具 ===== -->
  <g id="lane-03">
    <text x="64" y="720" class="t-lane">03  ·  安全与工具</text>

    <!-- Source of calls -->
    <rect x="64" y="744" width="200" height="88" rx="10" class="card"/>
    <text x="164" y="780" text-anchor="middle" class="t-body">拟执行工具调用</text>
    <text x="164" y="808" text-anchor="middle" class="t-muted">聊天工具 · Agent</text>

    <line x1="264" y1="788" x2="304" y2="788" stroke="#C16C50" stroke-width="1.5" marker-end="url(#m-terr)"/>

    <!-- Compact audit strip -->
    <g id="audit-gate">
      <rect x="304" y="744" width="520" height="88" rx="10" class="card"/>
      <text x="564" y="776" text-anchor="middle" class="t-body">工具执行前审核</text>
      <circle cx="360" cy="806" r="5" class="dot"/>
      <text x="372" y="812" class="t-muted">规则放行 / 拒绝</text>
      <circle cx="520" cy="806" r="5" class="dot"/>
      <text x="532" y="812" class="t-muted">可选模型审查</text>
      <circle cx="680" cy="806" r="5" class="dot"/>
      <text x="692" y="812" class="t-muted">需时用户确认</text>
    </g>

    <line x1="824" y1="788" x2="864" y2="788" stroke="#262624" stroke-width="1.5" marker-end="url(#m-char)"/>

    <rect x="864" y="744" width="280" height="88" rx="10" class="card"/>
    <text x="1004" y="780" text-anchor="middle" class="t-body">已批准工具执行</text>
    <text x="1004" y="808" text-anchor="middle" class="t-muted">密钥注入 · 输出脱敏</text>

    <!-- bottom support row -->
    <rect x="64" y="860" width="360" height="72" rx="10" class="card"/>
    <text x="244" y="890" text-anchor="middle" class="t-body">密钥库</text>
    <text x="244" y="916" text-anchor="middle" class="t-muted">密钥卡直达后端 · 模型不可读明文</text>

    <rect x="448" y="860" width="300" height="72" rx="10" class="card" id="event-service"/>
    <text x="598" y="890" text-anchor="middle" class="t-body">事件服务</text>
    <text x="598" y="916" text-anchor="middle" class="t-muted">进度 · 完成 · 异常</text>

    <rect x="772" y="860" width="240" height="72" rx="10" class="card"/>
    <text x="892" y="890" text-anchor="middle" class="t-body">检查点</text>
    <text x="892" y="916" text-anchor="middle" class="t-muted">暂停 / 重启续跑</text>
  </g>

  <!-- 拟调用 from agent pool bottom-center down into lane-03 source (short, in gutter) -->
  <path d="M 967 672 L 967 700 L 164 700 L 164 744"
        fill="none" stroke="#C16C50" stroke-width="1.5" marker-end="url(#m-terr)"/>
  <text x="180" y="718" class="t-edge" fill="#C16C50">拟调用</text>

  <!-- ② SSE: event service right -> host/remote corridor -> up -> UI right side -->
  <path d="M 748 896 L 1296 896 L 1296 218 L 1080 218"
        fill="none" stroke="#8A857C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-gray)"/>
  <text x="1308" y="560" class="t-edge">② SSE · 不经聊天模型</text>

  <!-- ③ approval card: gate top -> corridor -> UI -->
  <path d="M 824 744 L 824 720 L 1260 720 L 1260 218 L 1080 218"
        fill="none" stroke="#C16C50" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#m-terr)"/>
  <text x="1140" y="708" class="t-edge" fill="#C16C50">③ 审批卡片</text>

  <!-- completion event to supervisor (short dashed up from event service) -->
  <path d="M 598 860 L 598 700 L 579 700 L 579 664"
        fill="none" stroke="#8A857C" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#m-gray)"/>
  <text x="610" y="730" class="t-edge">完成 / 异常</text>

  <!-- ===== Remote ===== -->
  <g id="remote">
    <rect x="1356" y="294" width="404" height="680" rx="14" class="shell"/>
    <text x="1380" y="326" class="t-lane">远程主机</text>
    <text x="1728" y="326" text-anchor="end" class="t-tag">规划</text>

    <rect x="1388" y="360" width="340" height="110" rx="10" class="card"/>
    <text x="1558" y="408" text-anchor="middle" class="t-h">Remote Agent</text>
    <text x="1558" y="440" text-anchor="middle" class="t-muted">远程工具 · 隔离环境</text>

    <rect x="1388" y="500" width="340" height="150" rx="10" class="card"/>
    <text x="1558" y="545" text-anchor="middle" class="t-body">远程侧审核网关</text>
    <text x="1558" y="578" text-anchor="middle" class="t-muted">执行前本地拦截</text>
    <text x="1558" y="606" text-anchor="middle" class="t-muted">无本机代审捷径</text>

    <rect x="1388" y="680" width="340" height="120" rx="10" class="card"/>
    <text x="1558" y="725" text-anchor="middle" class="t-body">与本机关系</text>
    <text x="1558" y="756" text-anchor="middle" class="t-muted">本机：范围校验与协调</text>
    <text x="1558" y="782" text-anchor="middle" class="t-muted">挂入共享池 · 状态回流</text>

    <text x="1558" y="860" text-anchor="middle" class="t-small">不声称经本机路由即强制远程执行</text>
  </g>

  <!-- ④ dispatch to remote from agent pool right edge -->
  <line x1="1220" y1="620" x2="1356" y2="620" stroke="#8A857C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-gray)"/>
  <text x="1240" y="608" class="t-edge">④ 派活</text>

  <!-- Footer -->
  <g id="footer">
    <line x1="40" y1="1010" x2="1760" y2="1010" stroke="#D8D4CB" stroke-width="1"/>

    <text x="40" y="1045" class="t-lane">运行流程</text>
    <text x="40" y="1075" class="t-foot">① 完成 / 异常 → 任务监督器 → 唤醒聊天层汇报</text>
    <text x="40" y="1100" class="t-foot">② 步骤事件 → 事件服务 → SSE 直达 UI（不经聊天模型）</text>
    <text x="40" y="1125" class="t-foot">③ 需人工时：审核 → 审批卡片 → UI；批准后进入工具执行</text>
    <text x="40" y="1150" class="t-foot">④ 远程派活为规划能力；远程须自有审核网关</text>

    <text x="980" y="1045" class="t-lane">图例</text>
    <line x1="980" y1="1068" x2="1040" y2="1068" stroke="#262624" stroke-width="1.5"/>
    <text x="1052" y="1073" class="t-foot">控制 / 派活</text>
    <line x1="1180" y1="1068" x2="1240" y2="1068" stroke="#C16C50" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1252" y="1073" class="t-foot">唤醒 / 拟调用 / 审批</text>

    <line x1="980" y1="1098" x2="1040" y2="1098" stroke="#8A857C" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1052" y="1103" class="t-foot">SSE / 远程（规划）</text>
    <circle cx="990" cy="1128" r="5" class="dot"/>
    <text x="1004" y="1133" class="t-foot">审核决策点</text>
    <text x="1180" y="1133" class="t-foot">审批 ≠ 沙箱 · 生产建议隔离执行并限制网络</text>
  </g>
</svg>

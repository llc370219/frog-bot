name: Backend and clients

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./...
      - run: go test -race ./...
      # Agent 沙箱必须真的在 Linux 上跑过（不能因为内核不支持而跳过）
      - run: go test -v -count=1 -run 'Landlock|SelfTest' ./internal/sandbox
        env:
          FROG_REQUIRE_LANDLOCK: "1"
      - run: go build -trimpath -o bin/frogbot ./cmd/frogbot
      - uses: actions/upload-artifact@v4
        with:
          name: frogbot-linux-amd64
          path: bin/frogbot

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-app.sh
        working-directory: mac-claude
      - run: ditto -c -k --sequesterRsrc --keepParent mac-claude/build/frog.app mac-claude/build/frog-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frog-macos
          path: mac-claude/build/frog-macos.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleRelease
        working-directory: android-claude
      - uses: actions/upload-artifact@v4
        with:
          name: frog-android
          path: android-claude/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 编译 iOS 客户端（模拟器，不签名）
        run: |
          xcodebuild -project ios-claude/frog.xcodeproj -scheme frog -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" = 0
